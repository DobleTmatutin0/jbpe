<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Jardín Botánico</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header>
            <nav>
                <a href="#">Inicio</a>
                <a href="#">Ejemplares</a>
                <a href="#">Estadísticas</a>
            </nav>
        </header>

        <main>

            <section class="titulo">
                <h1>Ejemplares</h1>
                <button class="btn-nuevo">
                    + Nuevo
                </button>

            </section>

            <section class="busqueda">
                <input
                    type="text"
                    placeholder="Buscar ejemplar..."
                >
            </section>

            <section class="ejemplares-lista">

                <div class="ejemplar-card">

                    <span class="ejemplar-id">
                        A-145
                    </span>

                    <span class="ejemplar-taxon">
                        Prosopis flexuosa
                    </span>

                    <span class="estado accedido">
                        ACCEDIDO
                    </span>

                </div>

                <div class="ejemplar-card">

                    <span class="ejemplar-id">
                        A-146
                    </span>

                    <span class="ejemplar-taxon">
                        Larrea divaricata
                    </span>

                    <span class="estado adquisicion">
                        ADQUISICIÓN
                    </span>

                </div>

                <div class="ejemplar-card">

                    <span class="ejemplar-id">
                        A-147
                    </span>

                    <span class="ejemplar-taxon">
                        Neltuma alpataco
                    </span>

                    <span class="estado desaccedido">
                        DESACCEDIDO
                    </span>

                </div>

            </section>

        </main>

    </body>
</html>
